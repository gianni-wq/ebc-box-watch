name: box watch

# Every 5 minutes (off the hour's first minute, which GitHub delays most), check the box from
# outside and message Gianni when it stops answering and when it is back. watch.py says how.
# GitHub can take well over an hour to start a new schedule; a push touching this file
# registers it again (the first one had not fired 84 minutes after it was added, 2026-10-25).
on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send one test message, to prove the alert reaches the phone"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: box-watch
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v test_watch

  watch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check the box
        env:
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: python3 watch.py
      - name: Keep what it saw
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "box-watch"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "state $(date -u +%Y-%m-%dT%H:%MZ)" -- state.json
            git push -q
          fi
